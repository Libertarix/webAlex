name: News bot — publica noticia sanitaria diaria

# Cada día, coge la noticia más reciente sin usar de una fuente RSS real
# de salud/enfermería (ver scripts/news-bot/fuentes.json), le escribe un
# resumen original con Gemini (nunca inventado) y despliega directamente
# a producción en Vercel. Sin revisión humana previa.

on:
  schedule:
    - cron: "0 8 * * *" # intento principal, todos los días, 08:00 UTC
    # Intento de respaldo, mismo día, 6 horas después. Si el intento
    # principal ya publicó hoy, el script (generar-noticia.mjs) lo detecta
    # y no hace nada — esta segunda pasada solo actúa si la primera falló
    # del todo pese a sus reintentos y modelos de repuesto.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

# GitHub a veces retrasa los cron y "amontona" ejecuciones perdidas, que
# entonces disparan varias a la vez (visto en producción: dos ejecuciones
# de este workflow a 3 minutos una de otra, ninguna de las horas
# programadas). Si dos ejecuciones corren en paralelo, la segunda hace
# checkout antes de que la primera haga push y su "git push" final es
# rechazado sin más (no hay rebase automático) — así fallaba. El grupo de
# concurrencia comparte cola con blog-bot.yml (los dos tocan
# public/sitemap.xml) para que nunca haya dos publicaciones a la vez: la
# segunda simplemente espera en cola a que la primera termine del todo.
concurrency:
  group: bots-contenido-publicar
  cancel-in-progress: false

jobs:
  generar-y-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Generar noticia (resumen original de una fuente real)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/news-bot/generar-noticia.mjs

      - name: Comprobar si se generó una noticia nueva
        id: cambios
        run: |
          git add scripts/news-bot/usadas.json src/data/noticias-generadas.json public/sitemap.xml
          if git diff --cached --quiet; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
          else
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar el nuevo estado en este repo
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name "news-bot"
          git config user.email "actions@github.com"
          git commit -m "Noticias: nueva noticia generada automáticamente"
          intento=1
          until git push; do
            if [ "$intento" -ge 3 ]; then
              echo "No se pudo hacer push tras 3 intentos."
              exit 1
            fi
            echo "Push rechazado (intento $intento/3) — reintentando tras sincronizar con main..."
            git fetch origin main
            git rebase origin/main
            intento=$((intento + 1))
            sleep 5
          done

      - name: Desplegar a producción en Vercel
        if: steps.cambios.outputs.hay_cambios == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes
